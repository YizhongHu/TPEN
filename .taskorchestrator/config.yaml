traits:
  # Planner-selected on run-slice only; the schema cannot enforce that restriction.
  # This item keeps its own science report in science-analysis-conclusions.
  science:
    notes:
      - key: scientific-analysis-plan
        role: queue
        required: true
        description: "Planner: background, open question and evidence design."
        skill: scientific-analysis-plan
        guidance: "Use the `scientific-analysis-plan` skill."
        maxLength: 6000

      - key: science-analysis-conclusions
        role: work
        required: true
        description: "Analyst: this slice's own science answers, evidence and reasoning."
        skill: science-analysis-conclusions
        guidance: >-
          Use the `science-analysis-conclusions` skill. Write this slice's own
          science report; extra analysis items add their own reports rather than
          replacing this one.
        maxLength: 12000

      - key: backup-index
        role: work
        required: true
        description: "Analyst: preservation decisions, execution and coverage."
        guidance: >-
          Give the analyst and human terminal reviewer this science slice's own
          preservation decision and actual execution, including evidence that
          could disprove its answers. Link records of at least one Holystore
          backup, exact sources/destinations, copy/hash/inspection observations,
          omissions, recovery attempted or absent, and path/environment caveats.
          Requests are not storage authorization. Keep this same item open while
          required preservation remains, recording outstanding actions and owners;
          a promise is not a backup. If cancelled, describe what was and was not
          retained. No separate archive trait/item, universal full-restore
          mandate or preservation score. Cleanup still needs separate authority.
        maxLength: 4000
