project:
  rootId: 58348558-a4c8-4ed7-8f7b-829ef8163145
  name: TPEN

work_item_schemas:
  implementation-slice:
    lifecycle: auto
    notes:
      - key: acceptance-contract
        role: queue
        required: true
        description: "Planner: scope, non-goals, and acceptance criteria."
        guidance: "Define one reviewable PR layer. For stacks, identify the immediate predecessor task orchestrator item and/or branch; otherwise base on dev."
        maxLength: 3000

      - key: review-tier
        role: queue
        required: true
        description: "Review tier and reason."
        guidance: "Use the tier list in the `pr-review-loop` skill. Record T0, T1 or T2 with a one-line reason and post the same line on the PR. When unsure, use the higher tier."
        maxLength: 300

      - key: implementation-worker-initialization
        role: work
        required: true
        description: "Orchestrator: spawn an isolated implementation worker."
        guidance: "Use the `paseo` skill. Before dispatch, the orchestrator claims and advances the item, creates the isolated worktree, spawns the worker, then releases its claim. The worker claims before any edit with a short renewable TTL; record worker, claimRef, TTL, workspace and branch."
        skill: paseo
        maxLength: 1000

      - key: implementation-receipt
        role: work
        required: true
        description: "Worker: implementation handoff."
        guidance: "Record changes, pushed branch, PR URL, full head SHA, and worker-claim release before finishing."
        maxLength: 4000

      - key: implementation-worker-archival
        role: work
        required: true
        description: "Orchestrator: dispose of the implementation worker and workspace."
        guidance: "Use the `paseo` skill. Confirm the worker finished, its changes are pushed, no unpreserved work remains, and its claim is released before archiving the workspace."
        skill: paseo
        maxLength: 1000

      - key: tip-verification
        role: work
        required: true
        description: "Verifier: independent test results."
        guidance: "Use the `pr-verification` skill. A separate clean verifier tests the current full PR head and writes the receipt that skill defines, then its workspace is archived through Paseo."
        maxLength: 4000

      - key: reviewer-initialization
        role: work
        required: true
        description: "Orchestrator: initiate independent PR review."
        guidance: "Use the `pr-review-loop` and `paseo` skills. Read `review-tier`: T0 records no agent review; T1 uses one round; T2 uses one full round and at most one delta round. Record tier, reviewer/workspace IDs when used, and PR link."
        skill:
          - pr-review-loop
          - paseo
        maxLength: 1000

      - key: reviewer-archival
        role: work
        required: true
        description: "Orchestrator: archive reviewer and review-owned workspaces."
        guidance: "Use the `paseo` skill. Confirm review handoff and safe cleanup of test branches/workspaces. Archive the reviewer with Paseo; record outcome or recovery blocker."
        maxLength: 1000

      - key: review-summary
        role: work
        required: true
        description: "Orchestrator: summarize automated PR review."
        guidance: "Link review rounds and explicit dispositions of findings and tests, including green tests. Confirm accepted fixes/tests are integrated and verification passes before marking ready for human review. Move to review."
        maxLength: 2000

      - key: pr-disposition
        role: review
        required: true
        description: "Orchestrator: record final PR disposition."
        guidance: "Record human outcome and PR link. After confirmed merge, delete this PR's merged branch and its worktree, record both results, and only then complete. Record cancellation for an abandoned PR."
        maxLength: 1000

  # DRAFT ONLY. From experiment-slice-design-r10.md; not applied.
  run-slice:
    lifecycle: manual
    notes:
      - key: experiment-contract
        role: queue
        required: true
        description: "Planner: question, admission, roles and permission boundaries."
        skill: cluster-access
        guidance: >-
          Give the runner and terminal owner the question, scope, roles, inputs,
          dependency edges and named re-planning checkpoint/owner. Explain the
          science-trait decision and source admission: non-science uses a frozen
          dev candidate, never main; science uses main. Identify facility,
          resource/budget bounds, retention intentions and approval references or
          pending decisions. Consult current cluster-access and Clusters
          free-submit-queues at action time; this plan is not submission approval.
          Science needs human submission approval; other non-free queues need
          per-run operator approval relayed by the manager for run geometry
          and budget. The runner follows
          the runbook; analysts interpret. Later evidence may justify planning
          again, rather than extending this scope silently.
        maxLength: 4000

      - key: runbook-index
        role: queue
        required: true
        description: "Planner/runner: Git runbook path, source commit and revision history."
        guidance: >-
          Point the runner to a Markdown runbook file in the run's source
          repository. Identify its repo-relative path and full pinned source
          commit SHA, with the blob SHA if recorded. Read the file from that
          exact commit: the runbook and executable source share the commit the
          run uses. Planners explain changes, allowed edits, their bounds and
          owners; commit edits on a branch and review them through a PR to dev.
          A draft can enter work; before submission settle its choices and pin
          the reviewed file with the run's source. Non-science uses a frozen dev
          commit, never main; science uses a main commit containing its runbook.
          Record path, source commit SHA and any blob SHA in the submission
          record. Changing an approved snapshot requires a new pinned source
          commit and renewed relevant approvals. Keep earlier run identities and
          revision references in this index; the runbook itself is versioned in
          Git rather than copied into TO notes. An index update is not approval.
        maxLength: 2000

      - key: execution-index
        role: work
        required: true
        description: "Runner: submission, execution and collection evidence."
        guidance: >-
          Give the analyst and reviewer the mechanical record, linking preserved
          attempt receipts, the repo runbook path, full pinned source commit SHA
          (and blob SHA if recorded), and permission basis. Record
          actual source/configuration/runtime, submission response, job and node
          IDs and delivered resources. Link the artifact inventory with exact
          paths/hashes and the collection account, including missing or lost
          evidence. Say when no job ran. Preserve earlier attempts when updating
          this index. A denied session stops and hands off; uncertain submission
          is reconciled read-only. Runner observations are not interpretation or
          permission to repair, retry, cancel, archive or delete.
        maxLength: 6000

      - key: run-conclusions
        role: work
        required: true
        description: "Analyst: this slice's own answers and their reasoning."
        guidance: >-
          Leave this slice's own answers, relating records to the question,
          assumptions, reasoning and limits. Failure is data; use descriptive
          outcomes without grades. Tell later readers who checked what, how and
          under which assumptions. Examine job identity, actual delivered
          resources, pinned source, inventory/hashes and missing evidence.
          Record discrepancies, unresolved objections and what was not checked,
          without a verdict label. Distinguish records from interpretation and
          explain how the evidence supports or challenges the answers. For
          science, examine this item's science-analysis-conclusions against its
          data and methods and its preservation account; link that report here,
          rather than promising a future analysis item's report. Expanded
          arguments may occupy versioned TO notes on this same item. The
          terminal owner reads these checks and conclusions before acting;
          no separate verification note, extra reviewer layer or PR review is
          required.
        maxLength: 12000

      - key: terminal-record
        role: review
        required: true
        description: "Authorized owner: terminal decision and outstanding ownership."
        guidance: >-
          Identify the actor, cited approval and what work ended, including
          cancellation or missing evidence. Non-science runs need manager
          authority and human approval during the trial; science needs human
          approval. Record data disposition and any later action's owner and
          trigger; terminal never authorizes deletion. Science stays open while
          required preservation remains. Each science slice keeps its own
          account even when nothing ran. Dependents use terminal, not review.
          Suspicious evidence follows the linked spike, possible implementation
          and rerun path; creating those items grants no execution approval.
          Archive analyst and runner.
        maxLength: 3000

