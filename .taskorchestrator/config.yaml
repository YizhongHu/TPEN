project:
  rootId: 58348558-a4c8-4ed7-8f7b-829ef8163145
  name: TPEN

traits:
  artifact-lifecycle:
    notes:
      - key: artifact-policy
        role: queue
        required: true
        description: "Artifact retention, recovery, and disposition policy."
        guidance: "Define the artifact lifecycle policy, including retention, recovery expectations, and disposition boundaries."
      - key: artifact-inventory
        role: work
        required: true
        description: "Inventory of artifacts covered by the lifecycle decision."
        guidance: "Inventory the artifacts and identify what is retained, backed up to Holystore, archived to HPSS, or eligible for lifecycle-gated cleanup."
      - key: artifact-disposition-summary
        role: review
        required: true
        description: "Summary of the final artifact disposition."
        guidance: "Summarize exact output paths, disposition child IDs, and any directly retained paths."

work_item_schemas:
  implementation-slice:
    lifecycle: auto
    notes:
      - key: acceptance-contract
        role: queue
        required: true
        description: "Scope, non-goals, and observable completion criteria."
        guidance: "Define one reviewable PR layer before work starts. For a stacked layer, record its immediate predecessor item and branch; the bottom layer records dev. TPEN sets no stack-depth cap, but every layer must remain in one acyclic linear gh-stack chain."
        maxLength: 3000
      - key: implementation-receipt
        role: work
        required: true
        description: "Implemented surfaces, deviations, branch topology, and current branch tip."
        guidance: "Record files and behavior changed, deviations from the acceptance contract, branch, PR URL and base, immediate predecessor, full head SHA, gh stack view --json linearity result, and verification still outstanding. A partial or red result is not completion. An open or draft PR remains work/awaiting merge."
        maxLength: 4000
      - key: tip-verification
        role: review
        required: true
        description: "Independent clean verification bound to the exact final SHA."
        guidance: "Verify the exact full head SHA from a clean environment. Record verifier identity, commands, exit codes, pass/fail/skip counts, job ID when applicable, durable log locations, and the verified PR base/predecessor. Confirm every gh-stack layer is linear and needsRebase is false. Any changed SHA, moved predecessor, failing check, or unexecuted required check keeps the item in work or blocked. Human-confirmed merge is required before terminalization."
        skill: clean-final-verifier
        maxLength: 4000
  artifact-disposition:
    lifecycle: auto
    notes:
      - key: disposition-contract
        role: queue
        required: true
        description: "Contract for artifact disposition and recovery."
        guidance: "Define retain, Holystore backup, HPSS archive, recovery proof, and lifecycle-gated cleanup criteria."
      - key: disposition-receipt
        role: work
        required: true
        description: "Receipt for artifact disposition actions."
        guidance: "Record retain, Holystore backup, HPSS archive, recovery proof, and lifecycle-gated cleanup evidence."
      - key: disposition-verification
        role: review
        required: true
        description: "Verification of artifact disposition and recovery."
        guidance: "Verify retain, Holystore backup, HPSS archive, recovery proof, and lifecycle-gated cleanup."
