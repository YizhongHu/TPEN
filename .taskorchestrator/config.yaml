work_item_schemas:
  implementation-slice:
    lifecycle: auto
    notes:
      - key: acceptance-contract
        role: queue
        required: true
        description: "Planner: scope, non-goals, and acceptance criteria."
        guidance: "Define one reviewable PR layer. For stacks, identify the immediate predecessor task orchestrator item and/or branch; otherwise base on dev."
        maxLength: 3000

      - key: review-tier
        role: queue
        required: true
        description: "Review tier and reason."
        guidance: "Declare T0, T1, or T2 with one-line reason under manager-ruling-review-scope-20261109 and amendment-1; when unsure use the higher tier."

      - key: implementation-worker-initialization
        role: work
        required: true
        description: "Orchestrator: spawn an isolated implementation worker."
        guidance: "Before dispatch, the orchestrator claims and advances the item, creates the isolated worktree, spawns the worker, then releases its claim. The worker claims before any edit with a short renewable TTL; record worker, claimRef, TTL, workspace and branch."
        skill: paseo
        maxLength: 1000

      - key: implementation-receipt
        role: work
        required: true
        description: "Worker: implementation handoff."
        guidance: "Record changes, pushed branch, PR URL, full head SHA, and worker-claim release before finishing."
        maxLength: 4000

      - key: implementation-worker-archival
        role: work
        required: true
        description: "Orchestrator: dispose of the implementation worker and workspace."
        guidance: "Confirm the worker finished, its changes are pushed, no unpreserved work remains, and its claim is released before archiving the workspace."
        skill: paseo
        maxLength: 1000

      - key: tip-verification
        role: work
        required: true
        description: "Verifier: independent test results."
        guidance: "A separate clean verifier tests the current full PR head. Record that SHA, commands, outcomes, job IDs and TO receipts. Once item 55799bad is delivered, use its versioned fast Cannon runner. Per-job checkout, mutants, cache and TMPDIR are `/scratch/$USER/$SLURM_JOB_ID`, never `/tmp`; only `Lab/rhu/envs` and `Lab/rhu/runs` persist, and final evidence is in TO. The required literal `tip-verification` note names the current head and points to the immutable per-head receipt `tip-verification-<sha8>`. A changed head returns the PR to draft until independently verified at that head, unless the new head's git tree equals the verified head's tree (record both SHAs and the tree hash)."
        skill:
          - paseo
          - clean-final-verifier
        maxLength: 4000

      - key: reviewer-initialization
        role: review
        required: true
        description: "Orchestrator: initiate independent PR review."
        guidance: "Read `review-tier`: T0 records no agent review; T1 uses one pr-review-loop round; T2 follows the amendment. Record tier, reviewer/workspace IDs when used, and PR link."
        skill:
          - paseo
          - pr-review-loop
        maxLength: 1000

      - key: reviewer-archival
        role: review
        required: true
        description: "Orchestrator: archive reviewer and review-owned workspaces."
        guidance: "Confirm review handoff and safe cleanup of test branches/workspaces. Archive the reviewer with Paseo; record outcome or recovery blocker."
        skill: paseo
        maxLength: 1000

      - key: review-summary
        role: review
        required: true
        description: "Orchestrator: summarize automated PR review."
        guidance: "Link review rounds and explicit dispositions of findings and tests, including green tests. Confirm accepted fixes/tests are integrated and verification passes before marking ready for human review."
        maxLength: 2000

      - key: pr-disposition
        role: review
        required: true
        description: "Orchestrator: record final PR disposition."
        guidance: "Record human outcome and PR link. After confirmed merge, delete this PR's merged branch and its worktree, record both results, and only then complete. Record cancellation for an abandoned PR."
        maxLength: 1000

