work_item_schemas:
  implementation-slice:
    lifecycle: auto
    notes:
      - key: acceptance-contract
        role: queue
        required: true
        description: "Planner: scope, non-goals, and acceptance criteria."
        guidance: "Define one reviewable PR layer. For stacks, identify the immediate predecessor task orchestrator item and/or branch; otherwise base on dev."
        maxLength: 3000

      - key: implementation-worker-initialization
        role: work
        required: true
        description: "Orchestrator: spawn an isolated implementation worker."
        guidance: "Use Paseo to create a dedicated worktree and agent-namespaced branch from dev or the stack predecessor, then spawn the worker. Run check_authoritative_edit before its first edit. Record agent ID, workspace ID, branch, launch-guard result, agent provider, thinking effort, speed, permissions, and other relevant information, including record of exceptions to the norm."
        skill: paseo
        maxLength: 1000

      - key: implementation-receipt
        role: work
        required: true
        description: "Worker: implementation handoff."
        guidance: "Summarize changes and deviations. Record the pushed branch and PR URL."
        maxLength: 4000

      - key: implementation-worker-archival
        role: work
        required: true
        description: "Orchestrator: dispose of the implementation worker and workspace."
        guidance: "Confirm the worker has finished, its changes are pushed, and no unpreserved local work remains. Archive its workspace through Paseo. Record the outcome. Keep the remote branch until PR merge."
        skill: paseo
        maxLength: 1000

      - key: tip-verification
        role: work
        required: true
        description: "Verifier: independent test results."
        guidance: "Spawn a verifier worker. It is asked to test the submitted code independently. Record commands, outcomes, cluster job IDs, and durable logs. The verifier runs tests on cluster test/debug partitions. Its outputs are limited to temporary node-specific directories such as `/tmp` or `/scratch`. Archive the verifier workspace after it is done."
        skill:
          - paseo
          - clean-final-verifier
        maxLength: 4000

      - key: reviewer-initialization
        role: review
        required: true
        description: "Orchestrator: initiate independent PR review."
        guidance: "Use pr-review-loop for this PR. Record reviewer agent/workspace IDs and PR link."
        skill:
          - paseo
          - pr-review-loop
        maxLength: 1000

      - key: reviewer-archival
        role: review
        required: true
        description: "Orchestrator: archive reviewer and review-owned workspaces."
        guidance: "Confirm review handoff and safe cleanup of test branches/workspaces. Archive the reviewer with Paseo; record outcome or recovery blocker."
        skill: paseo
        maxLength: 1000

      - key: review-summary
        role: review
        required: true
        description: "Orchestrator: summarize automated PR review."
        guidance: "Link review rounds and explicit dispositions of findings and tests, including green tests. Confirm accepted fixes/tests are integrated and verification passes before marking ready for human review."
        maxLength: 2000

      - key: pr-disposition
        role: review
        required: true
        description: "Orchestrator: record final PR disposition."
        guidance: "Record the human review outcome and PR link. Complete the TO item only after confirmed merge; use cancellation for an abandoned PR."
        maxLength: 1000

