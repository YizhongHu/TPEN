[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpen-executor"
version = "0.1.0"
description = "Independent execution boundary for TPEN workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
]

[project.optional-dependencies]
parsl = ["parsl==2026.8.10"]

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.uv]
constraint-dependencies = [
  "certifi==2026.5.20",
  "charset-normalizer==3.4.7",
  "colorama==0.4.6",
  "filelock==3.29.0",
  "idna==3.16",
  "iniconfig==2.3.0",
  "antlr4-python3-runtime==4.9.3",
  "packaging==26.2",
  "pluggy==1.6.0",
  "pygments==2.20.0",
  "pycparser==3.0",
  "pyzmq==27.2.0",
  "PyYAML==6.0.3",
  "setproctitle==1.3.7",
  "typeguard==4.5.2",
  "typing-extensions==4.15.0",
  "urllib3==2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tpen_executor*"]

[tool.setuptools.package-data]
tpen_executor = ["conf/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
