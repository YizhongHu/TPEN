[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpen-executor"
version = "0.1.0"
description = "Independent execution boundary for TPEN workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.uv]
constraint-dependencies = [
  "colorama==0.4.6",
  "iniconfig==2.3.0",
  "antlr4-python3-runtime==4.9.3",
  "packaging==26.2",
  "pluggy==1.6.0",
  "pygments==2.20.0",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tpen_executor*"]

[tool.setuptools.package-data]
tpen_executor = ["conf/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
