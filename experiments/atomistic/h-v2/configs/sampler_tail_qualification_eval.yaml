# =============================================================================
# H-v2 sampler tail qualification: full radial/local-energy survival curves
# =============================================================================
#
# Shares the exact-hydrogen evaluation route with
# `configs/exact_canary_eval.yaml` (`tpen.physics.hydrogen.HydrogenExact`
# through `tpen.run.run_from_config`), but at the contract's
# `sampler_tail_qualification` shape (`contract_inputs.json`
# `tail_characterization.sampler_tail_qualification.shape_and_seeds`):
# 4,096 walkers, 256 retained draws, burn-in 1,000, stride 20.
#
# `model.alpha` and `runtime.seed` are overridden per run by
# `test_sampler_tail_qualification.py`: alpha 1.0 is the exact ground state
# (instrument control for the sampler itself -- every local energy is
# -0.5 Ha exactly, so this stream only exercises the radial tail check);
# alpha 1.2 is the known-imperfect qualification target, whose radial AND
# local-energy tails this test compares against the independent analytic
# oracle (`analytic_oracle.py`). Seeds come from the
# `sampler_tail_qualification` namespace in `contract_inputs.json`.
# =============================================================================

experiment:
  name: tpen_h_v2_sampler_tail_qualification
  sector: atomistic
  run_name: tpen_h_v2_sampler_tail_qualification_eval

run:
  root: experiments/atomistic/h-v2/outputs
  run_id: h-v2-sampler-tail-qualification
  dir: null
  timezone: America/New_York

runtime:
  seed: 940001
  device: cpu
  dtype: float64

system:
  id: atomic_hydrogen
  n_particles: 1
  spatial_dim: 3
  spin:
    n_up: 1
    n_down: 0
  nuclei:
    positions: [[0.0, 0.0, 0.0]]
    charges: [1.0]
  reference_energy: -0.5

atoms:
  _target_: tpen.data.atomic_configuration.AtomicConfiguration
  positions:
    _target_: torch.tensor
    data: ${system.nuclei.positions}
  charges:
    _target_: torch.tensor
    data: ${system.nuclei.charges}

runner:
  _target_: tpen.runner.Evaluate
  model: ${model}
  evaluator: ${evaluator}

model:
  _target_: tpen.physics.hydrogen.HydrogenExact
  atoms: ${atoms}
  alpha: 1.0

hamiltonian_terms:
  kinetic:
    _target_: tpen.physics.kinetic.KineticEnergy
  electron_nucleus:
    _target_: tpen.physics.potential.ElectronNucleusPotential
    atoms: ${atoms}
    eps: 0.0

sampler:
  _target_: tpen.sampling.metropolis.MetropolisSampler
  n_walkers: 4096
  burn_in: 1000
  n_steps: 20
  proposal_scale: 0.5
  seed: ${runtime.seed}
  n_electrons: ${system.n_particles}
  spatial_dim: ${system.spatial_dim}
  n_up: ${system.spin.n_up}
  n_down: ${system.spin.n_down}
  nuclear_positions:
    _target_: torch.tensor
    data: ${system.nuclei.positions}
  nuclear_charges:
    _target_: torch.tensor
    data: ${system.nuclei.charges}
  dtype: ${runtime.dtype}

evaluator:
  _target_: tpen.evaluation.Evaluator
  namespace: eval
  seed: ${runtime.seed}
  artifact_level: records
  task_failure_policy: fail_fast
  tasks:
    - name: trajectory
      namespace: trajectory
      output_dir: ${run.dir}/trajectory
      generator:
        _target_: tpen.evaluation.generators.TrajectoryMCMCGenerator
        sampler: ${sampler}
        hamiltonian_terms: ${hamiltonian_terms}
        n_draws: 256
        discard_draws: 0
        seed: ${runtime.seed}
        reset: true
        verify_model_unchanged: true
        chunk_size: 4096
      calculators:
        - _target_: tpen.evaluation.LocalEnergyCalculator
          hamiltonian_terms: ${hamiltonian_terms}
          return_terms: true
        - _target_: tpen.evaluation.WavefunctionCalculator
      summaries:
        - _target_: tpen.evaluation.SampledRecordWriter
          max_samples: 1048576
          include_term_energies: true
        - _target_: tpen.evaluation.SamplerStatsSummary
        - _target_: tpen.evaluation.LocalEnergySummary
        - _target_: tpen.evaluation.ReferenceEnergySummary
          reference_energy: ${system.reference_energy}

callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json

loggers:
  - _target_: tpen.logging.JSONL
    path: ${run.dir}/metrics.jsonl
