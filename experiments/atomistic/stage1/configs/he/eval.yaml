defaults: []
experiment: {name: stage1_he, sector: atomistic, run_name: he_eval}
run: {root: "${oc.env:TPEN_STAGE1_RESULTS_ROOT}", run_id: null, dir: null, timezone: America/New_York, layout: nested}
runtime: {seed: 0, device: cpu, dtype: float64}
system: {id: he_atom, n_particles: 2, spatial_dim: 3, spin: {n_up: 1, n_down: 1}, nuclei: {positions: [[0.0, 0.0, 0.0]], charges: [2.0]}}
atoms: {_target_: tpen.data.atomic_configuration.AtomicConfiguration, positions: {_target_: torch.tensor, data: "${system.nuclei.positions}"}, charges: {_target_: torch.tensor, data: "${system.nuclei.charges}"}}
system_descriptor: {_target_: tpen.physics.system.build_system_descriptor, particle: {_target_: tpen.physics.system.ParticleSpec, n_electrons: "${system.n_particles}", n_spin_up: "${system.spin.n_up}", n_spin_down: "${system.spin.n_down}", spatial_dim: "${system.spatial_dim}"}, terms: "${hamiltonian_terms}"}
load: {path: "???", mode: model_only, strict: true, allow_protocol_mismatch: false}
trajectory_identity: {checkpoint_file: "???"}
model: "${oc.select:stage1_he_model, null}"
stage1_he_model: {_target_: tpen.nn.TPENWaveFunction, trace_name: tpen, embedding: {_target_: tpen.nn.Embedding, max_order: 2, spatial_dim: "${system.spatial_dim}", out_channels: 4, hidden_channels: 16, num_hidden_layers: 1, include_spins: true}, layers: [{_target_: tpen.nn.TPENLayer, mixing: {_target_: tpen.nn.EquivariantMixing, max_order: 2, max_virtual_order: 2, channels: 4, implementation: vectorized, initial_weight: 0.5, activation: {_target_: torch.nn.SiLU}}, path_aggregation: {_target_: tpen.nn.PathAggregation, max_order: 2, max_virtual_order: 2, channels: 4, activation: {_target_: torch.nn.SiLU}}, update: {_target_: tpen.nn.ResidualUpdater}}], factors: [{_target_: tpen.nn.ElectronElectronCusp, trainable_range: true}, {_target_: tpen.nn.ElectronNucleusCusp, atoms: "${atoms}", law: {_target_: tpen.nn.CurvatureElectronNucleusCuspLaw, curvature_coefficient: 0.01, curvature_range: 1.0, trainable: true}}], readout: {_target_: tpen.nn.readout.PfaffianReadout, channels: 4, trainable: true}}
hamiltonian_terms: {kinetic: {_target_: tpen.physics.kinetic.KineticEnergy}, electron_nucleus: {_target_: tpen.physics.potential.ElectronNucleusPotential, atoms: "${atoms}", eps: 0.0}, electron_electron: {_target_: tpen.physics.potential.ElectronElectronInteraction}}
evaluation_sampler: {_target_: tpen.sampling.metropolis.MetropolisSampler, n_walkers: 4096, burn_in: 100, n_steps: 10, proposal_scale: 0.5, seed: "${runtime.seed}", n_electrons: "${system.n_particles}", spatial_dim: "${system.spatial_dim}", n_up: "${system.spin.n_up}", n_down: "${system.spin.n_down}", nuclear_positions: {_target_: torch.tensor, data: "${system.nuclei.positions}"}, nuclear_charges: {_target_: torch.tensor, data: "${system.nuclei.charges}"}, dtype: "${runtime.dtype}"}
evaluation_tasks: {mcmc_energy: {name: mcmc_energy, namespace: eval/mcmc_energy, output_dir: "${run.dir}/mcmc_energy", generator: {_target_: tpen.evaluation.generators.TrajectoryMCMCGenerator, sampler: "${evaluation_sampler}", hamiltonian_terms: "${hamiltonian_terms}", n_draws: 256, discard_draws: 0, seed: "${runtime.seed}", reset: true, verify_model_unchanged: true, system: "${system_descriptor}", evaluator: {_target_: tpen.physics.hamiltonian.NaiveLocalEnergyEvaluator}}, calculators: [{_target_: tpen.evaluation.calculators.LocalEnergyCalculator, hamiltonian_terms: "${hamiltonian_terms}", return_terms: true}, {_target_: tpen.evaluation.calculators.WavefunctionCalculator}], summaries: [{_target_: tpen.evaluation.summaries.LocalEnergySummary}, {_target_: tpen.evaluation.summaries.SamplerStatsSummary}, {_target_: tpen.evaluation.summaries.SampledRecordWriter, max_samples: 1048576, include_term_energies: true}]}}
evaluator: {_target_: tpen.evaluation.Evaluator, namespace: eval, seed: "${runtime.seed}", artifact_level: records, task_failure_policy: fail_fast, tasks: ["${evaluation_tasks.mcmc_energy}"]}
runner: {_target_: tpen.runner.Evaluate, model: "${model}", load: "${load}", evaluator: "${evaluator}"}
callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json
loggers:
  - _target_: tpen.logging.JSONL
    path: ${run.dir}/metrics.jsonl
