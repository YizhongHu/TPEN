experiment: {name: stage1_he, sector: atomistic, run_name: he_train}
run: {root: "???", run_id: null, dir: null, timezone: America/New_York, layout: nested}
runtime: {seed: 0, device: cpu, dtype: float64}
checkpoint_steps: [0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 11000, 12000, 13000, 14000, 15000, 16000, 17000, 18000, 19000, 20000, 21000, 22000, 23000, 24000, 25000, 26000, 27000, 28000, 29000, 30000, 31000, 32000, 33000, 34000, 35000, 36000, 37000, 38000, 39000, 40000, 41000, 42000, 43000, 44000, 45000, 46000, 47000, 48000, 49000, 50000, 51000, 52000, 53000, 54000, 55000, 56000, 57000, 58000, 59000, 60000, 61000, 62000, 63000, 64000, 65000, 66000, 67000, 68000, 69000, 70000, 71000, 72000, 73000, 74000, 75000, 76000, 77000, 78000, 79000, 80000, 81000, 82000, 83000, 84000, 85000, 86000, 87000, 88000, 89000, 90000, 91000, 92000, 93000, 94000, 95000, 96000, 97000, 98000, 99000, 100000]
system: {id: he_atom, n_particles: 2, spatial_dim: 3, spin: {n_up: 1, n_down: 1}, nuclei: {positions: [[0.0, 0.0, 0.0]], charges: [2.0]}}
atoms: {_target_: tpen.data.atomic_configuration.AtomicConfiguration, positions: {_target_: torch.tensor, data: "${system.nuclei.positions}"}, charges: {_target_: torch.tensor, data: "${system.nuclei.charges}"}}
system_descriptor: {_target_: tpen.physics.system.build_system_descriptor, particle: {_target_: tpen.physics.system.ParticleSpec, n_electrons: "${system.n_particles}", n_spin_up: "${system.spin.n_up}", n_spin_down: "${system.spin.n_down}", spatial_dim: "${system.spatial_dim}"}, terms: "${hamiltonian_terms}"}
model: {_target_: tpen.nn.TPENWaveFunction, trace_name: tpen, embedding: {_target_: tpen.nn.Embedding, max_order: 2, spatial_dim: "${system.spatial_dim}", out_channels: 32, hidden_channels: 128, num_hidden_layers: 1, include_spins: true}, layers: [{_target_: tpen.nn.TPENLayer, mixing: {_target_: tpen.nn.EquivariantMixing, max_order: 2, max_virtual_order: 2, channels: 32, implementation: vectorized, initial_weight: 0.5, activation: {_target_: torch.nn.SiLU}}, path_aggregation: {_target_: tpen.nn.PathAggregation, max_order: 2, max_virtual_order: 2, channels: 32, activation: {_target_: torch.nn.SiLU}}, update: {_target_: tpen.nn.ResidualUpdater}}], factors: [{_target_: tpen.nn.ElectronElectronCusp, trainable_range: true}, {_target_: tpen.nn.ElectronNucleusCusp, atoms: "${atoms}", law: {_target_: tpen.nn.CurvatureElectronNucleusCuspLaw, curvature_coefficient: 0.01, curvature_range: 1.0, trainable: true}}], readout: {_target_: tpen.nn.readout.PfaffianReadout, channels: 32, trainable: true}}
hamiltonian_terms: {kinetic: {_target_: tpen.physics.kinetic.KineticEnergy}, electron_nucleus: {_target_: tpen.physics.potential.ElectronNucleusPotential, atoms: "${atoms}", eps: 0.0}, electron_electron: {_target_: tpen.physics.potential.ElectronElectronInteraction}}
optimizer: {_target_: torch.optim.Adam, _partial_: true, lr: 0.005}
sampler: {_target_: tpen.sampling.metropolis.MetropolisSampler, n_walkers: 256, burn_in: 100, n_steps: 10, proposal_scale: 0.5, seed: "${runtime.seed}", n_electrons: "${system.n_particles}", spatial_dim: "${system.spatial_dim}", n_up: "${system.spin.n_up}", n_down: "${system.spin.n_down}", nuclear_positions: {_target_: torch.tensor, data: "${system.nuclei.positions}"}, nuclear_charges: {_target_: torch.tensor, data: "${system.nuclei.charges}"}, dtype: "${runtime.dtype}"}
trainer: {_target_: tpen.training.trainer.VMCTrainer, max_steps: 100000, log_every_n_steps: 100, return_terms: true}
runner: {_target_: tpen.runner.Train, model: "${model}", sampler: "${sampler}", hamiltonian_terms: "${hamiltonian_terms}", optimizer: "${optimizer}", trainer: "${trainer}"}
callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json
  - _target_: tpen.callback.Checkpoint
    terminal: false
    schedule: {_target_: tpen.checkpoint.ExplicitUpdates, updates: "${checkpoint_steps}"}
    payload: {_target_: tpen.checkpoint.TrainResume}
    output_dir: ${run.dir}/checkpoints
