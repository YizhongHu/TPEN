experiment: {name: stage1_hooke1, sector: atomistic, run_name: hooke1_train}
run: {root: "${oc.env:TPEN_STAGE1_RESULTS_ROOT}", run_id: null, dir: null, timezone: America/New_York, layout: nested}
runtime: {seed: 0, device: cpu, dtype: float64}
checkpoint_steps: [1000]
system: {id: hooke_one_electron_omega0.5, n_particles: 1, spatial_dim: 3, spin: {n_up: 1, n_down: 0}, nuclei: {positions: [[0.0, 0.0, 0.0]], charges: [0.0]}}
atoms: {_target_: tpen.data.atomic_configuration.AtomicConfiguration, positions: {_target_: torch.tensor, data: "${system.nuclei.positions}"}, charges: {_target_: torch.tensor, data: "${system.nuclei.charges}"}}
system_descriptor: {_target_: tpen.physics.system.build_system_descriptor, particle: {_target_: tpen.physics.system.ParticleSpec, n_electrons: "${system.n_particles}", n_spin_up: "${system.spin.n_up}", n_spin_down: "${system.spin.n_down}", spatial_dim: "${system.spatial_dim}"}, terms: "${hamiltonian_terms}"}
model:
  _target_: tpen.nn.TPENWaveFunction
  trace_name: tpen
  embedding: {_target_: tpen.nn.Embedding, max_order: 2, spatial_dim: "${system.spatial_dim}", out_channels: 32, hidden_channels: 128, num_hidden_layers: 1, include_spins: true}
  layers:
    - _target_: tpen.nn.TPENLayer
      mixing: {_target_: tpen.nn.EquivariantMixing, max_order: 2, max_virtual_order: 2, channels: 32, implementation: vectorized, initial_weight: 0.5, activation: {_target_: torch.nn.SiLU}}
      path_aggregation: {_target_: tpen.nn.PathAggregation, max_order: 2, max_virtual_order: 2, channels: 32, activation: {_target_: torch.nn.SiLU}}
      update: {_target_: tpen.nn.ResidualUpdater}
  factors:
    - _target_: tpen.nn.GaussianConfinement
      coefficient: 0.25
      trainable: false
  readout: {_target_: tpen.nn.readout.PfaffianReadout, channels: 32, trainable: true}
hamiltonian_terms:
  kinetic: {_target_: tpen.physics.kinetic.KineticEnergy}
  harmonic_trap: {_target_: tpen.physics.potential.HarmonicTrap, omega: 0.5}
optimizer: {_target_: torch.optim.Adam, _partial_: true, lr: 0.005}
sampler: {_target_: tpen.sampling.metropolis.MetropolisSampler, n_walkers: 256, burn_in: 100, n_steps: 10, proposal_scale: 0.5, seed: "${runtime.seed}", n_electrons: "${system.n_particles}", spatial_dim: "${system.spatial_dim}", n_up: "${system.spin.n_up}", n_down: "${system.spin.n_down}", dtype: "${runtime.dtype}"}
trainer: {_target_: tpen.training.trainer.VMCTrainer, max_steps: 1000, log_every_n_steps: 100, return_terms: true}
runner: {_target_: tpen.runner.Train, model: "${model}", sampler: "${sampler}", hamiltonian_terms: "${hamiltonian_terms}", optimizer: "${optimizer}", trainer: "${trainer}"}
callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json
  - _target_: tpen.callback.Checkpoint
    terminal: false
    schedule:
      _target_: tpen.checkpoint.ExplicitUpdates
      updates: "${checkpoint_steps}"
    payload:
      _target_: tpen.checkpoint.TrainResume
    output_dir: ${run.dir}/checkpoints
