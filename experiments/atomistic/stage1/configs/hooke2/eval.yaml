defaults: []
experiment: {name: stage1_hooke2, sector: atomistic, run_name: hooke2_eval}
run: {root: "${oc.env:TPEN_STAGE1_RESULTS_ROOT}", run_id: null, dir: null, timezone: America/New_York, layout: nested}
runtime: {seed: 0, device: cpu, dtype: float64}
system: {id: hooke_pair_singlet_omega0.5, n_particles: 2, spatial_dim: 3, spin: {n_up: 1, n_down: 1}}
system_descriptor: {_target_: tpen.physics.system.build_system_descriptor, particle: {_target_: tpen.physics.system.ParticleSpec, n_electrons: "${system.n_particles}", n_spin_up: "${system.spin.n_up}", n_spin_down: "${system.spin.n_down}", spatial_dim: "${system.spatial_dim}"}, terms: "${hamiltonian_terms}"}
load: {path: "???", mode: model_only, strict: true, allow_protocol_mismatch: false}
trajectory_identity: {checkpoint_file: "???"}
model: {_target_: tpen.nn.TPENWaveFunction, trace_name: tpen, embedding: {_target_: tpen.nn.Embedding, max_order: 2, spatial_dim: "${system.spatial_dim}", out_channels: 4, hidden_channels: 16, num_hidden_layers: 1, include_spins: true}, layers: [{_target_: tpen.nn.TPENLayer, mixing: {_target_: tpen.nn.EquivariantMixing, max_order: 2, max_virtual_order: 2, channels: 4, implementation: vectorized, initial_weight: 0.5, activation: {_target_: torch.nn.SiLU}}, path_aggregation: {_target_: tpen.nn.PathAggregation, max_order: 2, max_virtual_order: 2, channels: 4, activation: {_target_: torch.nn.SiLU}}, update: {_target_: tpen.nn.ResidualUpdater}}], factors: [{_target_: tpen.nn.GaussianConfinement, coefficient: 0.25, trainable: false}, {_target_: tpen.nn.ElectronElectronCusp, same_spin_coefficient: 0.25, opposite_spin_coefficient: 0.5, range_parameter: 1.0, trainable_range: false}], readout: {_target_: tpen.nn.readout.PfaffianReadout, channels: 4}}
hamiltonian_terms: {kinetic: {_target_: tpen.physics.kinetic.KineticEnergy}, harmonic_trap: {_target_: tpen.physics.potential.HarmonicTrap, omega: 0.5}, electron_electron: {_target_: tpen.physics.potential.ElectronElectronInteraction}}
evaluation_sampler: {_target_: tpen.sampling.metropolis.MetropolisSampler, n_walkers: 4096, burn_in: 100, n_steps: 10, proposal_scale: 0.5, seed: "${runtime.seed}", n_electrons: "${system.n_particles}", spatial_dim: "${system.spatial_dim}", n_up: "${system.spin.n_up}", n_down: "${system.spin.n_down}", dtype: "${runtime.dtype}"}
evaluation_tasks: {mcmc_energy: {name: mcmc_energy, namespace: eval/mcmc_energy, output_dir: "${run.dir}/mcmc_energy", generator: {_target_: tpen.evaluation.generators.TrajectoryMCMCGenerator, sampler: "${evaluation_sampler}", hamiltonian_terms: "${hamiltonian_terms}", n_draws: 256, discard_draws: 0, seed: "${runtime.seed}", reset: true, verify_model_unchanged: true, system: "${system_descriptor}", evaluator: {_target_: tpen.physics.hamiltonian.NaiveLocalEnergyEvaluator}}, calculators: [{_target_: tpen.evaluation.calculators.LocalEnergyCalculator, hamiltonian_terms: "${hamiltonian_terms}", return_terms: true}, {_target_: tpen.evaluation.calculators.WavefunctionCalculator}], summaries: [{_target_: tpen.evaluation.summaries.SampledRecordWriter, max_samples: 1048576, include_term_energies: true}]}}
evaluator: {_target_: tpen.evaluation.Evaluator, namespace: eval, seed: "${runtime.seed}", artifact_level: records, task_failure_policy: fail_fast, tasks: ["${evaluation_tasks.mcmc_energy}"]}
runner: {_target_: tpen.runner.Evaluate, model: "${model}", load: "${load}", evaluator: "${evaluator}"}
callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json
