# Opt-in T8 comparator arm (same positive symmetric trunk, no tail factor).
experiment: {name: stage1_hooke2_positive_singlet_comparator, sector: atomistic, run_name: hooke2_positive_singlet_comparator}
run: {root: "???", run_id: null, dir: null, timezone: America/New_York, layout: nested}
runtime: {seed: 0, device: cpu, dtype: float64}
system: {id: hooke_pair_singlet_omega0.5, n_particles: 2, spatial_dim: 3, spin: {n_up: 1, n_down: 1}}
model: {_target_: tpen.nn.TPENWaveFunction, trace_name: tpen, embedding: {_target_: tpen.nn.Embedding, max_order: 2, spatial_dim: "${system.spatial_dim}", out_channels: 32, hidden_channels: 128, num_hidden_layers: 1, include_spins: true}, layers: [{_target_: tpen.nn.TPENLayer, mixing: {_target_: tpen.nn.EquivariantMixing, max_order: 2, max_virtual_order: 2, channels: 32, implementation: vectorized, initial_weight: 0.5, activation: {_target_: torch.nn.SiLU}}, path_aggregation: {_target_: tpen.nn.PathAggregation, max_order: 2, max_virtual_order: 2, channels: 32, activation: {_target_: torch.nn.SiLU}}, update: {_target_: tpen.nn.ResidualUpdater}}], factors: [{_target_: tpen.nn.GaussianConfinement, coefficient: 0.25, trainable: false}, {_target_: tpen.nn.ElectronElectronCusp, same_spin_coefficient: 0.25, opposite_spin_coefficient: 0.5, range_parameter: 1.0, trainable_range: false}], readout: {_target_: tpen.nn.PositiveSingletReadout, channels: 32}}
hamiltonian_terms: {kinetic: {_target_: tpen.physics.kinetic.KineticEnergy}, harmonic_trap: {_target_: tpen.physics.potential.HarmonicTrap, omega: 0.5}, electron_electron: {_target_: tpen.physics.potential.ElectronElectronInteraction}}
optimizer: {_target_: torch.optim.Adam, _partial_: true, lr: 0.005}
sampler: {_target_: tpen.sampling.metropolis.MetropolisSampler, n_walkers: 256, burn_in: 100, n_steps: 10, proposal_scale: 0.5, seed: "${runtime.seed}", n_electrons: "${system.n_particles}", spatial_dim: "${system.spatial_dim}", n_up: "${system.spin.n_up}", n_down: "${system.spin.n_down}", dtype: "${runtime.dtype}"}
trainer: {_target_: tpen.training.trainer.VMCTrainer, max_steps: 1000, log_every_n_steps: 100, return_terms: true}
runner: {_target_: tpen.runner.Train, model: "${model}", sampler: "${sampler}", hamiltonian_terms: "${hamiltonian_terms}", optimizer: "${optimizer}", trainer: "${trainer}"}
defaults: []
