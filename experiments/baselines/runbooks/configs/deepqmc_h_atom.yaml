# DeepQMC/Hydra launch fragment for BL-R1.
#
# Apply these as the shown `deepqmc` overrides, rather than selecting a
# historical output directory.  DeepQMC's packaged `hamil/mol=H` group is the
# executable producer configuration; its resolved Hydra snapshot is checked
# against the physical identity below before this run may advance.
hydra_overrides:
  hamil/mol: H
  task.electron_batch_size: 4096
resolved_system_expectation:
  nuclei:
    charges: [1]
    positions_bohr: [[0.0, 0.0, 0.0]]
  electrons:
    total: 1
    spins: [1, 0]
