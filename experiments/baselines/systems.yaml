# Canonical comparison systems for the SOTA NN-QMC baseline program.
#
# Evidence discipline (see README.md section 0). Every reference energy in this
# file was copied from a source that was actually read; none came from model
# memory. A value that could not be sourced is `null` with
# `confidence: unverified`. Do not fill a null in without recording where the
# digits came from.
#
# confidence:
#   transcribed - digits copied from the cited source by a reading pass.
#   unverified  - not sourced yet; the value is null and must stay null.
#
# Atomic units throughout: energies in hartree, lengths in bohr.

schema_version: 1
units:
  energy: hartree
  length: bohr

# Applies to every entry whose reference_source names the FermiNet table.
caveats:
  ferminet_table_ar5iv: >-
    NARROWED 2026-08-13 after an independent re-read. The first extraction, on
    2026-08-12, collapsed a wide multi-method table and read the wrong column
    for molecules; that error is corrected in this file and in
    experiments/baselines/README.md section 5.1. The re-read confirmed all
    thirteen FermiNet energies and all eight atomic reference values
    digit-for-digit, cross-checking against arXiv:1011.4343 and arXiv:1012.0709.
    What remains: APS and the published PDF still block automated retrieval, so
    every value here rests on ar5iv renderings plus corroborating papers, never
    on a publisher PDF. That is stronger than the original pass but is not the
    same as a hand check, so a spot-check against the published PDF is still
    owed before these digits enter a plot or a paper.

systems:
  - id: hooke_one_electron_omega0.5
    description: >-
      One-electron Hooke atom in a 3D isotropic harmonic trap at omega = 1/2.
      Atomic units are used: the exact oscillator ground-state energy is
      3*omega/2 = 0.75 hartree.
    n_up: 1
    n_down: 0
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: harmonic_trap
          omega: 0.5
    reference_energy_hartree: 0.75
    reference_source: >-
      Analytic three-dimensional harmonic-oscillator ground state in atomic
      units, psi(r) = exp(-omega |r|^2/2), with E = 3*omega/2 = 0.75 Ha at
      omega = 0.5; independently encoded by
      tpen/physics/hooke.py::OneElectronHookeExact.
    confidence: transcribed
    notes: >-
      Exact one-electron reference; this record is distinct from the
      two-electron Taut-solvable Hooke pair record below.

  - id: hooke_pair_singlet_omega0.5
    description: >-
      Two-electron Hooke atom (3D isotropic harmonic trap plus Coulomb
      repulsion) at the Taut-solvable omega = 1/2, singlet. The only system TPEN
      runs today; see experiments/hooke/tpen-pair-v1/configs/train.yaml.
    n_up: 1
    n_down: 1
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: harmonic_trap
          omega: 0.5
        - term: electron_electron
    reference_energy_hartree: 2.0
    reference_source: >-
      Taut, Phys. Rev. A 48, 3561 (1993). APS blocks automated retrieval, so the
      primary was not read; the value and its closed form are reproduced in
      Savin, arXiv:2010.13776 (SECONDARY source, read 2026-08-13). The same
      closed form is encoded independently in tpen/physics/hooke.py
      ::HookeSingletExact, giving an in-repo cross-check that agrees:
      psi = (1 + r12/2) exp(-(r1^2 + r2^2)/4) with exact_energy = 2.0.
    confidence: transcribed
    notes: >-
      Exact, not variational-best-estimate: at the Taut omegas the two-electron
      relative-motion problem is solvable in closed form.

  - id: he_atom
    description: Helium atom, singlet ground state.
    n_up: 1
    n_down: 1
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: electron_nucleus
          nuclei:
            - element: He
              charge: 2
              position_bohr: [0.0, 0.0, 0.0]
        - term: electron_electron
    reference_energy_hartree: -2.903724377034119598
    reference_source: >-
      Aznabaev, Bekbaev and Korobov, "Nonrelativistic energy levels of helium
      atom", arXiv:1810.11288, Table 3, which reports the 1 1S
      infinite-nuclear-mass nonrelativistic energy as
      -2.90372 43770 34119 59831 11592 45194 40444 66969 25310 a.u. and
      attributes it to Schwartz (2006); their own N = 22000 basis calculation
      agrees to 33 significant digits.
    confidence: transcribed
    notes: >-
      Exact nonrelativistic energy at infinite nuclear mass, so it excludes
      relativistic, QED and finite-mass corrections; compare against it only
      with a Hamiltonian that also omits them. He is absent from the FermiNet
      table (that atom sequence starts at Li), so this value comes from the
      helium literature rather than from any NN-QMC paper. The stored value is
      truncated to what float64 can hold - the source carries roughly 46
      significant digits, far beyond double precision, and far beyond any
      variational Monte Carlo error bar this program will produce.

  - id: li_atom
    description: Lithium atom, doublet ground state.
    n_up: 2
    n_down: 1
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: electron_nucleus
          nuclei:
            - element: Li
              charge: 3
              position_bohr: [0.0, 0.0, 0.0]
        - term: electron_electron
    reference_energy_hartree: -7.47806032
    reference_source: >-
      Puchalski and Pachucki, Phys. Rev. A 73, 022503 (2006). Re-checked
      2026-08-13 and confirmed digit-for-digit against the exact column of the
      FermiNet atomic table (Pfau et al. 2020, arXiv:1909.02487), and
      independently reproduced from arXiv:1011.4343 and arXiv:1012.0709.
    confidence: transcribed
    notes: >-
      ATTRIBUTION CORRECTED 2026-08-13. The value is right, but its source is
      not Chakravorty et al. (1993) -- that is a misattribution in FermiNet's
      own footnote, which cites Chakravorty for the whole exact column. Li comes
      from Puchalski and Pachucki (2006); Be through Ne genuinely are
      Chakravorty and are unaffected. FermiNet reports -7.47798(1) Ha
      (99.82(3)% of the correlation energy), about 0.08 mHa above the reference.
      This program reproduced that run on one A100 and obtained -7.477892(9) Ha
      (Slurm 38985858_0); see the R2 receipt on Task Orchestrator item
      c762e330.

  - id: be_atom
    description: Beryllium atom, singlet ground state.
    n_up: 2
    n_down: 2
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: electron_nucleus
          nuclei:
            - element: Be
              charge: 4
              position_bohr: [0.0, 0.0, 0.0]
        - term: electron_electron
    reference_energy_hartree: -14.66736
    reference_source: >-
      Reference column, FermiNet atomic/molecular results table, Pfau et al.
      2020, arXiv:1909.02487, transcribed via ar5iv HTML 2026-08-12; mirrored in
      experiments/baselines/README.md section 5.1. See
      caveats.ferminet_table_ar5iv.
    confidence: transcribed
    notes: >-
      FermiNet reports -14.66733(3) Ha (99.97(3)% of the correlation energy).

  - id: b_atom
    description: Boron atom, doublet ground state (1s2 2s2 2p1, one unpaired electron).
    n_up: 3
    n_down: 2
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: electron_nucleus
          nuclei:
            - element: B
              charge: 5
              position_bohr: [0.0, 0.0, 0.0]
        - term: electron_electron
    reference_energy_hartree: -24.65391
    reference_source: >-
      Chakravorty, Gwaltney, Davidson, Parpia and Froese Fischer, Phys. Rev. A
      47, 3649 (1993), read via Brown, Trail, Lopez Rios and Needs,
      "Energies of the first row atoms from quantum Monte Carlo",
      arXiv:1011.4343, Table 1, and corroborated digit-for-digit by Seth,
      Lopez Rios and Needs, arXiv:1012.0709, Table 2. Read 2026-08-13.
    confidence: transcribed
    notes: >-
      ESTIMATED-EXACT, not exact: the Chakravorty values are nonrelativistic
      total energies inferred from experimental ionization potentials with
      relativistic and QED corrections removed, supplemented by CAS
      calculations. They are not variational bounds and carry roughly 0.1 mHa
      uncertainty for the heavier first-row atoms, so a baseline that lands
      within 0.1 mHa of this number is at the resolution of the reference
      itself, not confirmed against it. Chakravorty et al. 1993 was not read
      directly (APS paywalls it); the evidence is two independent QMC papers
      printing identical digits. Spin sector matches what the reproduction runs
      used: FermiNet's utils/elements.py assigns group 13 one unpaired
      electron, giving n_up = 3, n_down = 2 for five electrons. FermiNet
      reports -24.65370(3) Ha (99.83(3)% of the correlation energy), about 0.2
      mHa above this reference.

  - id: n_atom
    description: Nitrogen atom, quartet ground state (1s2 2s2 2p3, three unpaired electrons).
    n_up: 5
    n_down: 2
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: electron_nucleus
          nuclei:
            - element: N
              charge: 7
              position_bohr: [0.0, 0.0, 0.0]
        - term: electron_electron
    reference_energy_hartree: -54.5892
    reference_source: >-
      Chakravorty, Gwaltney, Davidson, Parpia and Froese Fischer, Phys. Rev. A
      47, 3649 (1993), read via Brown, Trail, Lopez Rios and Needs,
      arXiv:1011.4343, Table 1, and corroborated digit-for-digit by Seth,
      Lopez Rios and Needs, arXiv:1012.0709, Table 2. Read 2026-08-13.
    confidence: transcribed
    notes: >-
      ESTIMATED-EXACT on the same footing as b_atom: derived from experimental
      ionization potentials with relativistic and QED corrections removed, not
      a variational bound, roughly 0.1 mHa uncertain. Only five decimals are
      published for N, one fewer than for Be, so do not read more precision
      into the stored value than it carries. Spin sector matches the
      reproduction runs: FermiNet's utils/elements.py assigns group 15 three
      unpaired electrons, giving n_up = 5, n_down = 2 for seven electrons.
      FermiNet reports -54.58882(6) Ha (99.80(3)% of the correlation energy),
      about 0.4 mHa above this reference.
  - id: lih_molecule
    description: Lithium hydride at its equilibrium geometry, singlet ground state.
    n_up: 2
    n_down: 2
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: electron_nucleus
          nuclei:
            - element: Li
              charge: 3
              position_bohr: [-1.5075, 0.0, 0.0]
            - element: H
              charge: 1
              position_bohr: [1.5075, 0.0, 0.0]
        - term: electron_electron
        - term: nucleus_nucleus
    reference_energy_hartree: -8.070548
    reference_source: >-
      Cencek and Rychlewski, Chem. Phys. Lett. 320, 549-552 (2000), the
      explicitly-correlated-Gaussian Born-Oppenheimer value at R = 3.015 bohr.
      Quoted with this attribution by both the FermiNet table (Pfau et al. 2020,
      arXiv:1909.02487) and the PauliNet table (Hermann et al.,
      arXiv:1909.08423). Re-read 2026-08-13.
    confidence: transcribed
    notes: >-
      CORRECTED 2026-08-13. This entry previously held -8.070696, which is the
      CCSD(T)/CBS cell, not the exact reference: the FermiNet molecular table is
      a wide multi-method table (System, R, FermiNet, VMC, DMC, CCSD(T)/CBS,
      HF/CBS, Exact, %corr) and the original ar5iv pass collapsed it and read
      the wrong column. Column identity is pinned two independent ways -- the
      HF/CBS column holds -7.98737 for LiH, and the VMC/DMC columns reproduce
      arXiv:1012.0709 character-for-character. The geometry gap is also closed:
      R = 3.015 bohr, nuclei placed symmetrically about the origin on x.
      FermiNet itself reports -8.07050(1) Ha (99.94(1)% of the correlation
      energy).

  - id: h2_molecule
    description: >-
      Hydrogen molecule at R = 1.4 bohr, singlet ground state. The smallest
      molecular Coulomb system, and the only one in this registry at TPEN's
      current two-electron size -- so it is the shortest bridge from the Hooke
      pair to a system every NN-QMC baseline also reports.
    n_up: 1
    n_down: 1
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: electron_nucleus
          nuclei:
            - element: H
              charge: 1
              position_bohr: [-0.7, 0.0, 0.0]
            - element: H
              charge: 1
              position_bohr: [0.7, 0.0, 0.0]
        - term: electron_electron
        - term: nucleus_nucleus
    reference_energy_hartree: -1.17447
    reference_source: >-
      Kolos and Wolniewicz (1965), the standard Born-Oppenheimer reference,
      quoted as the exact column of the PauliNet results table (Hermann et al.,
      arXiv:1909.08423, Table 1). Read 2026-08-13.
    confidence: transcribed
    notes: >-
      Geometry is load-bearing here and does not match the baseline default. The
      value above is the R = 1.4 bohr reference, whereas FermiNet's built-in
      diatomic table uses 0.737164 angstrom = 1.393 bohr, a different geometry.
      Runs against this entry must pin the bond length explicitly rather than
      accepting that default. The energy difference between the two geometries
      is second order at the minimum and small (order 0.01 mHa), but it is a
      systematic offset, not noise, and it is silent if unstated. Only five
      digits were transcribed; the Kolos-Wolniewicz value is quoted to more
      precision in the primary source, which has not been read here.

  - id: n2_molecule
    description: >-
      Nitrogen dimer at R = 2.068 bohr, singlet ground state. The largest
      system in this registry and the standard hard case for NN-QMC: a triple
      bond whose correlation energy no single-reference method recovers well.
    n_up: 7
    n_down: 7
    spatial_dim: 3
    hamiltonian:
      terms:
        - term: kinetic
        - term: electron_nucleus
          nuclei:
            - element: N
              charge: 7
              position_bohr: [-1.034, 0.0, 0.0]
            - element: N
              charge: 7
              position_bohr: [1.034, 0.0, 0.0]
        - term: electron_electron
        - term: nucleus_nucleus
    reference_energy_hartree: -109.5423
    reference_source: >-
      Filippi and Umrigar, J. Chem. Phys. 105, 213 (1996), quoted as the Exact
      column of the FermiNet molecular table (Pfau, Spencer, Matthews and Foulkes,
      arXiv:1909.02487, Table 2) at R = 2.068 bohr. Read 2026-08-13.
    confidence: transcribed
    notes: >-
      The FermiNet molecular table is a wide multi-method table (System, R,
      FermiNet, VMC, DMC, CCSD(T)/CBS, HF/CBS, Exact, %corr); -109.5425 is a
      neighbouring cell, not the exact value, and an earlier collapsed
      extraction read it. Column identity was pinned on the 2026-08-13 re-read
      by the same two-way check used for lih_molecule. Geometry is stated
      because it is load-bearing: R = 2.068 bohr, nuclei symmetric about the
      origin on x, which is also the geometry the DeepQMC reproduction runs
      used, so that comparison is geometry-matched rather than approximately
      matched. FermiNet reports -109.5388(1) Ha (99.36(2)% of the correlation
      energy) -- 3.5 mHa above the reference, the largest shortfall anywhere in
      its table and the reason N2 is the interesting case rather than a
      formality.
