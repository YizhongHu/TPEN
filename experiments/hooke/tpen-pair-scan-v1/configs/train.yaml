# =============================================================================
# tpen-pair-scan-v1 — scan training base config (MIG-TPEN-000 D17)
# =============================================================================
#
# Base config for the four-axis TPEN screening scan over the Hooke omega=0.5
# singlet: basis semantics x equivariant-op activation x learning rate x
# channels. The public override surface is scalar and slot-oriented, so the grid
# planner drives an entire row through a handful of dotted paths and never
# rewrites YAML.
#
# ---------------------------------------------------------------------------
# This file is NOT self-contained. Merge the basis library first.
# ---------------------------------------------------------------------------
#
# `choices.basis` is deliberately absent: the four levels of the basis axis live
# in ONE table at `experiments/hooke/choices/basis_levels.yaml`, so that "the
# scan ran the level we tested" is checkable rather than a claim about two files
# that were once identical. `tpen.run.load_config` reads exactly one YAML file
# (`OmegaConf.load`) with no include or defaults-list mechanism, so the library
# is merged in before the run:
#
#   uv run python -c "from omegaconf import OmegaConf; \
#     OmegaConf.save(OmegaConf.merge( \
#       OmegaConf.load('experiments/hooke/tpen-pair-scan-v1/configs/train.yaml'), \
#       OmegaConf.load('experiments/hooke/choices/basis_levels.yaml')), \
#       'merged_train.yaml')"
#
# `OmegaConf.save` preserves interpolations, so `merged_train.yaml` is itself a
# valid single-file config for `run.py --config`. Loading THIS file alone leaves
# `${choices.basis...}` dangling, which is the intended failure: it is loud, and
# it cannot be reached by accident from a launcher that performs the merge.
#
# Run (cluster, gpu_test), one grid row:
#   srun -p gpu_test --gres=gpu:1 -c 4 --mem=32G -t 0:30:00 \
#     uv run --extra cu126 python run.py --config merged_train.yaml \
#     run_parameters.basis_slot=hooke-total-shell \
#     run_parameters.activation_slot=Tanh \
#     run_parameters.lr=1.0e-3 run_parameters.channels=16 \
#     run_parameters.training_model_seed=0 \
#     run_parameters.training_sampler_seed=0 \
#     run_parameters.validation_sampler_seed=0 \
#     run.root=experiments/hooke/tpen-pair-scan-v1/results/01_train \
#     run.layout=flat run.run_id=<config_id>/<attempt_id>
#
# `model` must RESOLVE identically to `eval.yaml`'s `model` for every slot
# combination: validation restores a train checkpoint under
# `mode: model_only, strict: true`, which rejects any wiring difference.
# `tests/unit/experiments/test_scan_config_surface.py` pins that identity across
# the slot grid so the two files cannot drift.
# =============================================================================

experiment:
  name: ${study.name}
  sector: pair
  run_name: ${study.name}_train

study:
  name: tpen_pair_scan_v1
  stage: "01_train"
  # Planner-injected provenance. `config_id` names the grid row; `attempt_id`
  # distinguishes retries of the same row.
  attempt_id: null
  config_id: null

run:
  root: experiments/hooke/tpen-pair-scan-v1/results/01_train
  # Flat layout means run.dir = run.root / run.run_id, so the planner realizes
  # the staged "<config_id>/<attempt_id>" tree by setting run.run_id alone.
  layout: flat
  run_id: null
  dir: null
  # Experiment logging is America/New_York (CLAUDE.md, Conventions). Set here
  # rather than left null for a launcher to inject: `resolve_run_clock` silently
  # falls back to UTC on a null value (`tpen/artifacts.py:366-368`), so a
  # launcher that forgot to inject it would produce correctly-formatted
  # timestamps in the wrong zone. A launcher may still override it.
  timezone: America/New_York

runtime:
  # Model-initialization stream. See the seed discussion in `run_parameters`:
  # this is ONE of three independent seeds, not the run's only seed.
  seed: ${run_parameters.training_model_seed}
  device: cuda
  dtype: float64

terminal:
  enabled: true
  level: info
  color: auto
  rich: auto
  progress: false

# -----------------------------------------------------------------------------
# Physical system
# -----------------------------------------------------------------------------
#
# Hooke omega=0.5 singlet: E = 2.0 Ha exactly (`tpen/physics/hooke.py:15,19`,
# Taut 1993). omega is NOT an axis, and it appears in three places that Hydra
# cannot keep in sync by arithmetic — see the envelope block.
system:
  name: hooke_pair
  n_particles: 2
  spatial_dim: 3
  omega: 0.5
  spin:
    n_up: 1
    n_down: 1

# -----------------------------------------------------------------------------
# Scalar run parameters — the entire public override surface
# -----------------------------------------------------------------------------
#
# Every axis of the scan, and nothing else, is reachable from here. Four axes
# plus three seeds plus one measurement knob.
#
# THREE INDEPENDENT SEEDS, not one. tpen-pair-v1 has a single `runtime.seed`
# with `sampler.seed: ${runtime.seed}` (`train.yaml:28,108`), which fuses model
# initialization and the sampler chain into one stream. The scan's paired-seed
# rows need them separable: validation has to reproduce a train run's MODEL
# while drawing a fresh sampler stream, which is impossible when one integer
# drives both.
#
#   training_model_seed      -> runtime.seed          (parameter initialization)
#   training_sampler_seed    -> sampler.seed          (training MCMC chain)
#   validation_sampler_seed  -> eval.yaml's evaluation sampler
#
# `validation_sampler_seed` is declared here even though training never reads
# it, and `training_sampler_seed` is declared in `eval.yaml` for the mirror
# reason. That is deliberate: `load_config` applies overrides with
# `OmegaConf.merge(cfg, OmegaConf.from_dotlist(...))` (`tpen/run.py:88-90`),
# which SILENTLY CREATES an unknown key rather than rejecting it. A planner that
# emits one seed triple per row against a config declaring only two of the three
# paths would therefore no-op on the third with no error anywhere. Declaring the
# full triple in both stages is what makes a stray seed path impossible.
run_parameters:
  # One of the four levels in experiments/hooke/choices/basis_levels.yaml.
  basis_slot: no-basis
  # One of the four levels in `choices.activation` below.
  activation_slot: SiLU
  lr: 1.0e-3
  channels: 8
  training_model_seed: 0
  training_sampler_seed: 0
  validation_sampler_seed: 0
  # Device synchronization for the timing callbacks. FALSE for the production
  # grid: `TrainStepTiming` synchronizes at both scope boundaries
  # (`train_step_timing.py:61,72`), which perturbs the quantity being measured
  # and serializes work that would otherwise overlap. The P0-e timing probe
  # flips this to true, where attribution matters more than throughput.
  accelerator_synchronize: false

# -----------------------------------------------------------------------------
# Structured choice library: the activation axis
# -----------------------------------------------------------------------------
#
# `activation_slot` drives ONLY `mixing.activation` and
# `path_aggregation.activation`. The embedding MLP is a HELD CONTROL — see the
# comment on the embedding block.
#
# The basis axis library is merged in from
# `experiments/hooke/choices/basis_levels.yaml` (see the header).
choices:
  activation:
    # Zero-preserving: Gamma(0) == 0, so the non-distinct tuple entries mixing
    # never writes stay zero.
    SiLU:
      activation:
        _target_: torch.nn.SiLU
      tags: [main, zero_preserving]

    Tanh:
      activation:
        _target_: torch.nn.Tanh
      tags: [main, zero_preserving]

    # Gamma(0) != 0. `EquivariantMixing` applies the activation to the full
    # block including the non-distinct tuple entries it never writes
    # (`equivariant_mixing.py:87-90`), so these two levels write an invariant
    # constant there — 0.5 for Sigmoid, 1.0 for GaussianActivation. At
    # n_particles=2 the readout antisymmetrization is expected to cancel it;
    # `tests/unit/nn/test_gaussian_activation.py` states the contamination
    # contract, and the scan report must not attribute a level difference to
    # "activation shape" without accounting for it.
    Sigmoid:
      activation:
        _target_: torch.nn.Sigmoid
      tags: [main, nonzero_at_zero]

    # tpen.nn.GaussianActivation is exp(-x**2 / (2 sigma**2)), NOT
    # `GaussianDecayGate` (exp(-x / (2 sigma**2)), which diverges on the signed
    # feature blocks an equivariant stage carries). sigma is fixed and
    # non-trainable per D3.
    Gaussian:
      activation:
        _target_: tpen.nn.GaussianActivation
        sigma: 1.0
      tags: [main, nonzero_at_zero, gaussian]

# -----------------------------------------------------------------------------
# Model scale
# -----------------------------------------------------------------------------
#
# `channels` is a SINGLE fan-out point. tpen-pair-v1 spells the width as four
# independent literal `4`s (`train.yaml:56,66,75,91`), one per consumer, so
# there is no override that moves all four and no error if three of them move.
# Here every consumer interpolates `model_params.channels`, which interpolates
# `run_parameters.channels`; a width that differs between the embedding output
# and the mixing input is not representable.
#
# The axis is a cost axis as well as a capacity axis. `PfaffianReadout` batches
# its leading walker and channel dimensions, so its Python recursion depends
# only on particle count. Channel cost must be measured on the target hardware;
# it is not assumed free.
model_params:
  max_order: 2
  max_virtual_order: 2
  channels: ${run_parameters.channels}
  # Not an axis. Held at the tpen-pair-v1 value.
  hidden_channels: 16
  num_hidden_layers: 1
  mixing_implementation: vectorized
  mixing_initial_weight: 0.5

# Provisional. The P0-e timing probe owns `max_steps` and `n_walkers`; the
# values below are the pair_stability_v3 budget carried over so a smoke run is
# shaped like a production row, NOT a chosen scan budget.
sampler_params:
  n_walkers: 1024
  burn_in: 500
  n_steps: 10
  proposal_scale: 0.35

training:
  max_steps: 500
  # 500 steps x 288 runs: logging every step is 144k rows carrying information a
  # rolling mean already summarizes.
  log_every_n_steps: 10
  return_terms: true

optimizer_params:
  lr: ${run_parameters.lr}

checks:
  every_n_steps: 50
  fail_fast: true
  data_integrity:
    max_nonfinite_energy_fraction: 0.0
    max_nonfinite_logabs_fraction: 0.0
    check_loss: true
    check_wavefunction_output: true
    check_batch: true
    strict_sign_values: true
  gradients:
    check_finite: true
  sampler:
    fail_fast: false
  equivariance:
    probability: 1.0
    permutation_fraction: 1.0
    # n_particles=2 admits exactly two permutations; one non-identity
    # permutation exhausts the orbit.
    max_permutations: 1
    atol: 1.0e-06
    rtol: 1.0e-06

# Timing cadence. Read the asymmetry below before "tidying" it: the two
# callbacks do NOT respond to the same knob, and that was measured, not assumed.
#
# `TrainPhaseTiming` honours `every_n_steps`: it pops the kwarg and builds its
# own report `Cadence` (`train_phase_timing.py:64-74`). A 60-step smoke emitted 6
# phase rows.
#
# `TrainStepTiming` does NOT. It forwards `every_n_steps` to the base, which
# stores it as an attribute (`callback/base.py:104`) while typed delivery is
# gated by `SubscriptionGroup(cadence=...)` — and `TrainStepTiming` constructs
# its group without one, so `group_state.gate is None` and every occurrence is
# delivered. The same 60-step smoke emitted 60 step rows. Passing the kwarg there
# would look like a throttle and do nothing, so it is deliberately NOT passed.
#
# Consequence, accepted rather than hidden: a 500-step run writes ~500
# `train/perf` step rows, which dominate that run's `metrics.csv`. Throttling it
# needs a `cadence=` on the callback's subscription group, i.e. a production
# change, which is out of scope here. `rolling_window` is what makes the stream
# interpretable at that density.
timing:
  every_n_steps: ${training.log_every_n_steps}
  rolling_window: 20

load:
  path: null
  mode: none
  strict: true
  allow_protocol_mismatch: false

# ONE terminal checkpoint per run, and deliberately NOT cadence-gated. The
# composed schedule makes that policy explicit: `TerminalOnly` selects no
# periodic boundaries and always admits the terminal boundary. Validation
# restores the final model under `model_only`, so intermediate checkpoints are
# not part of this study's contract.
checkpoint:
  periodic: false
  terminal: true
  schedule:
    _target_: tpen.checkpoint.TerminalOnly
  payload:
    _target_: tpen.checkpoint.TrainResume
  keep_last: 1
  save_optimizer: true
  save_trainer: true
  save_sampler: true
  save_rng: true

status:
  every_n_steps: 50
  include:
    - train/loss
    - train/energy
    - train/energy_stderr
    - train/sampler/acceptance_rate
    - train/grad_norm
    - train/local_energy_finite_fraction

# =============================================================================
# Component specs
# =============================================================================
runner:
  _target_: tpen.runner.Train
  model: ${model}
  sampler: ${sampler}
  hamiltonian_terms: ${hamiltonian_terms}
  optimizer: ${optimizer}
  trainer: ${trainer}
  load: ${load}
  # NO `callbacks` or `loggers` here. They are config-root and RunContext-owned;
  # `_instantiate_runner` raises ValueError on a runner that declares either
  # (`tpen/run.py:343-348`).

# -----------------------------------------------------------------------------
# Model: basis -> embedding -> TPEN layer -> Pfaffian readout -> envelopes
# -----------------------------------------------------------------------------
model:
  _target_: tpen.nn.TPENWaveFunction
  trace_name: tpen

  # Selected from the merged-in basis library. `basis` and the embedding's
  # `in_features` come from the SAME slot, so the embedding input width cannot
  # drift from the basis feeding it.
  basis: ${choices.basis.${run_parameters.basis_slot}.basis}

  embedding:
    _target_: tpen.nn.Embedding
    max_order: ${model_params.max_order}
    spatial_dim: ${system.spatial_dim}
    out_channels: ${model_params.channels}
    hidden_channels: ${model_params.hidden_channels}
    num_hidden_layers: ${model_params.num_hidden_layers}
    # Inert on the three basis levels (`in_features` overrides the derived width
    # and the basis supplies its own spin channel); on `no-basis` it is what
    # produces the derived per-particle width 3 + 1 = 4
    # (`tpen/nn/embedding.py:112-117`).
    include_spins: true
    # A slot key, NOT `${tpen.basis_feature_dim:${model.basis}}`: that resolver
    # instantiates its argument and reads `out_features`, and
    # `instantiate(None)` has neither, so a bare interpolation raises TypeError
    # on the `no-basis` level (`tpen/config.py:66-70`).
    in_features: ${choices.basis.${run_parameters.basis_slot}.in_features}
    # DELIBERATE HELD CONTROL — do not wire this to `run_parameters`.
    #
    # `activation_slot` sweeps the equivariant-op activation only. The embedding
    # MLP is pinned to SiLU at every level of the activation axis, which is the
    # `tpen/nn/mlp.py:61` default written out rather than inherited.
    #
    # Why: decision D2 (Task Orchestrator note `decision-log-D1-D9`) defines the
    # TPEN activation contract as owned by `EquivariantMixing` and
    # `PathAggregation`. The embedding MLP is a
    # plain feedforward net that merely happens to accept an `activation` kwarg
    # — a separate concept. Sweeping both would move two unrelated things per
    # axis step and make the axis uninterpretable; held fixed, the embedding is
    # a control and the axis isolates the novel TPEN surface.
    #
    # Why spelled out rather than left to the default: an implicit default is
    # unobservable. The layer-3 basis library learned this on
    # `include_gaussian_factor` — omitting it where it merely restated the
    # default was undetectable by any test. Written here, "the embedding is a
    # control" is a property of the config that a reader and a test can both
    # check, and it survives a change to the MLP default.
    activation:
      _target_: torch.nn.SiLU

  layers:
    - _target_: tpen.nn.TPENLayer
      mixing:
        _target_: tpen.nn.EquivariantMixing
        max_order: ${model_params.max_order}
        max_virtual_order: ${model_params.max_virtual_order}
        channels: ${model_params.channels}
        implementation: ${model_params.mixing_implementation}
        initial_weight: ${model_params.mixing_initial_weight}
        activation: ${choices.activation.${run_parameters.activation_slot}.activation}
      path_aggregation:
        _target_: tpen.nn.PathAggregation
        max_order: ${model_params.max_order}
        max_virtual_order: ${model_params.max_virtual_order}
        channels: ${model_params.channels}
        activation: ${choices.activation.${run_parameters.activation_slot}.activation}
      update:
        _target_: tpen.nn.ResidualUpdater

  envelope:
    _target_: tpen.nn.AdditiveEnvelope
    envelopes:
      # Harmonic confinement: coefficient = omega / 2 = 0.25 for the Hooke trap.
      #
      # There is no arithmetic resolver in `tpen/config.py`, so this cannot be
      # written as an interpolation of `system.omega` and the two values are
      # pinned independently in BOTH train.yaml and eval.yaml. That is four
      # places one number has to appear consistently, which is why agreement is
      # ASSERTED by a test rather than promised by this comment
      # (`tests/unit/experiments/test_scan_config_surface.py`). omega is not an
      # axis; if it ever becomes one, this coupling has to be solved first.
      - _target_: tpen.nn.GaussianConfinement
        coefficient: 0.25
      - _target_: tpen.nn.ElectronElectronCusp

  readout:
    _target_: tpen.nn.readout.PfaffianReadout
    channels: ${model_params.channels}

hamiltonian_terms:
  kinetic:
    _target_: tpen.physics.kinetic.KineticEnergy
  harmonic_trap:
    _target_: tpen.physics.potential.HarmonicTrap
    omega: ${system.omega}
  electron_electron:
    _target_: tpen.physics.potential.ElectronElectronInteraction

sampler:
  _target_: tpen.sampling.metropolis.MetropolisSampler
  n_walkers: ${sampler_params.n_walkers}
  burn_in: ${sampler_params.burn_in}
  n_steps: ${sampler_params.n_steps}
  proposal_scale: ${sampler_params.proposal_scale}
  # The training MCMC stream, independent of model initialization.
  seed: ${run_parameters.training_sampler_seed}
  n_electrons: ${system.n_particles}
  spatial_dim: ${system.spatial_dim}
  n_up: ${system.spin.n_up}
  n_down: ${system.spin.n_down}
  dtype: ${runtime.dtype}

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: ${optimizer_params.lr}

trainer:
  _target_: tpen.training.trainer.VMCTrainer
  max_steps: ${training.max_steps}
  log_every_n_steps: ${training.log_every_n_steps}
  return_terms: ${training.return_terms}

# -----------------------------------------------------------------------------
# Callbacks — config-root and RunContext-owned (CLAUDE.md, Config ownership)
# -----------------------------------------------------------------------------
callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json
    every_n_steps: ${status.every_n_steps}
    include: ${status.include}
  - _target_: tpen.callback.DataIntegrity
    every_n_steps: ${checks.every_n_steps}
    fail_fast: ${checks.fail_fast}
    max_nonfinite_energy_fraction: ${checks.data_integrity.max_nonfinite_energy_fraction}
    max_nonfinite_logabs_fraction: ${checks.data_integrity.max_nonfinite_logabs_fraction}
    check_loss: ${checks.data_integrity.check_loss}
    check_wavefunction_output: ${checks.data_integrity.check_wavefunction_output}
    check_batch: ${checks.data_integrity.check_batch}
    strict_sign_values: ${checks.data_integrity.strict_sign_values}
  - _target_: tpen.callback.GradientStats
    every_n_steps: ${checks.every_n_steps}
    fail_fast: ${checks.fail_fast}
    check_finite: ${checks.gradients.check_finite}
  - _target_: tpen.callback.SamplerHealth
    every_n_steps: ${checks.every_n_steps}
    fail_fast: ${checks.sampler.fail_fast}
  - _target_: tpen.callback.RuntimeEquivariance
    every_n_steps: ${checks.every_n_steps}
    probability: ${checks.equivariance.probability}
    fail_fast: ${checks.fail_fast}
    artifact_dir: ${run.dir}/checks/equivariance
    checkers:
      - _target_: tpen.equivariance.checks.FullModelEquivarianceChecker
        permutation_fraction: ${checks.equivariance.permutation_fraction}
        max_permutations: ${checks.equivariance.max_permutations}
        seed: ${runtime.seed}
        atol: ${checks.equivariance.atol}
        rtol: ${checks.equivariance.rtol}
      - _target_: tpen.equivariance.checks.TraceEquivarianceChecker
        permutation_fraction: ${checks.equivariance.permutation_fraction}
        max_permutations: ${checks.equivariance.max_permutations}
        seed: ${runtime.seed}
        compare_output: false
        atol: ${checks.equivariance.atol}
        rtol: ${checks.equivariance.rtol}
  # Timing. tpen-pair-v1 registers none of these, which is why a real smoke
  # run's metrics.csv carried no timing keys at all and the cost table for a
  # 288-run grid would have been blank in every per-phase column.
  - _target_: tpen.callback.RunTiming
    accelerator_synchronize: ${run_parameters.accelerator_synchronize}
  # No `every_n_steps`: it is inert on this callback and would misrepresent the
  # row cost. See the `timing` block for the measurement.
  - _target_: tpen.callback.TrainStepTiming
    rolling_window: ${timing.rolling_window}
    accelerator_synchronize: ${run_parameters.accelerator_synchronize}
  - _target_: tpen.callback.TrainPhaseTiming
    every_n_steps: ${timing.every_n_steps}
    accelerator_synchronize: ${run_parameters.accelerator_synchronize}
  # The composed schedule and payload are owned by the root `checkpoint` block;
  # this callback only wires that stream into the root-owned callback list.
  - _target_: tpen.callback.Checkpoint
    periodic: ${checkpoint.periodic}
    terminal: ${checkpoint.terminal}
    schedule: ${checkpoint.schedule}
    payload: ${checkpoint.payload}
    keep_last: ${checkpoint.keep_last}
    save_optimizer: ${checkpoint.save_optimizer}
    save_trainer: ${checkpoint.save_trainer}
    save_sampler: ${checkpoint.save_sampler}
    save_rng: ${checkpoint.save_rng}
    output_dir: ${run.dir}/checkpoints

loggers:
  - _target_: tpen.logging.CSV
    path: ${run.dir}/metrics.csv
  - _target_: tpen.logging.JSONL
    path: ${run.dir}/metrics.jsonl
