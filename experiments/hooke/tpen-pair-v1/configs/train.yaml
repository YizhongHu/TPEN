# tpen-pair-v1 — placeholder TPEN experiment, train config.
#
# First runnable end-to-end config for the post-migration TPEN stack
# (MIG-TPEN-000 slices a/b1/b2): real-space mixing/aggregation with
# op-owned activations, no Fourier/irrep stages, wavefunction-level
# AdditiveEnvelope(confinement + electron-electron cusp).
#
# Run (cluster, gpu_test):
#   srun -p gpu_test --gres=gpu:1 -c 4 --mem=16G -t 0:30:00 \
#     uv run --extra cu126 python run.py \
#     --config experiments/hooke/tpen-pair-v1/configs/train.yaml
#
# The Hooke per-axis basis knob (decisions D10/D11) is deliberately not
# wired here: the basis slice landed (#148/#159) and D15(f) then withdrew
# the basis-mode axis from this smoke, which stays no-basis. The four-level
# basis axis lives in the tpen-pair-scan-v1 grid scan instead (D17).

experiment:
  name: tpen_pair_v1
  sector: pair
  run_name: tpen_pair_v1_train

run:
  root: experiments/hooke/tpen-pair-v1/outputs
  run_id: null
  dir: null
  timezone: America/New_York

runtime:
  seed: 0
  device: cuda
  dtype: float64

system:
  name: hooke_pair
  n_particles: 2
  spatial_dim: 3
  omega: 0.5
  spin:
    n_up: 1
    n_down: 1

runner:
  _target_: tpen.runner.Train
  model: ${model}
  sampler: ${sampler}
  hamiltonian_terms: ${hamiltonian_terms}
  optimizer: ${optimizer}
  trainer: ${trainer}

model:
  _target_: tpen.nn.TPENWaveFunction
  trace_name: tpen
  embedding:
    _target_: tpen.nn.Embedding
    max_order: 2
    spatial_dim: ${system.spatial_dim}
    out_channels: 4
    hidden_channels: 16
    num_hidden_layers: 1
    include_spins: true
  layers:
    - _target_: tpen.nn.TPENLayer
      mixing:
        _target_: tpen.nn.EquivariantMixing
        max_order: 2
        max_virtual_order: 2
        channels: 4
        implementation: vectorized
        initial_weight: 0.5
        activation:
          _target_: torch.nn.SiLU
      path_aggregation:
        _target_: tpen.nn.PathAggregation
        max_order: 2
        max_virtual_order: 2
        channels: 4
        activation:
          _target_: torch.nn.SiLU
      update:
        _target_: tpen.nn.ResidualUpdater
  envelope:
    _target_: tpen.nn.AdditiveEnvelope
    envelopes:
      # Harmonic confinement: coefficient = omega / 2 for the Hooke trap.
      # Hydra cannot do the arithmetic, so editing system.omega requires
      # editing this too — in BOTH train.yaml and eval.yaml.
      - _target_: tpen.nn.GaussianConfinement
        coefficient: 0.25
      - _target_: tpen.nn.ElectronElectronCusp
  readout:
    _target_: tpen.nn.readout.PfaffianReadout
    channels: 4

hamiltonian_terms:
  kinetic:
    _target_: tpen.physics.kinetic.KineticEnergy
  harmonic_trap:
    _target_: tpen.physics.potential.HarmonicTrap
    omega: ${system.omega}
  electron_electron:
    _target_: tpen.physics.potential.ElectronElectronInteraction

sampler:
  _target_: tpen.sampling.metropolis.MetropolisSampler
  n_walkers: 128
  burn_in: 100
  n_steps: 10
  proposal_scale: 0.5
  seed: ${runtime.seed}
  n_electrons: ${system.n_particles}
  spatial_dim: ${system.spatial_dim}
  n_up: ${system.spin.n_up}
  n_down: ${system.spin.n_down}
  dtype: ${runtime.dtype}

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.005

trainer:
  _target_: tpen.training.trainer.VMCTrainer
  max_steps: 25
  log_every_n_steps: 1
  return_terms: true

callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json
  - _target_: tpen.callback.DataIntegrity
    every_n_steps: 1
    fail_fast: true
    max_nonfinite_energy_fraction: 0.0
    max_nonfinite_logabs_fraction: 0.0
    check_loss: true
    check_wavefunction_output: true
    check_batch: true
    strict_sign_values: true
  - _target_: tpen.callback.GradientStats
    every_n_steps: 5
    fail_fast: true
    check_finite: true
  - _target_: tpen.callback.SamplerHealth
    every_n_steps: 5
    fail_fast: false
  - _target_: tpen.callback.RuntimeEquivariance
    every_n_steps: 5
    probability: 1.0
    fail_fast: true
    artifact_dir: ${run.dir}/checks/equivariance
    checkers:
      - _target_: tpen.equivariance.checks.FullModelEquivarianceChecker
        permutation_fraction: 1.0
        max_permutations: 1
        seed: ${runtime.seed}
        atol: 1.0e-06
        rtol: 1.0e-06
      - _target_: tpen.equivariance.checks.TraceEquivarianceChecker
        permutation_fraction: 1.0
        max_permutations: 1
        seed: ${runtime.seed}
        compare_output: false
        atol: 1.0e-06
        rtol: 1.0e-06
  - _target_: tpen.callback.Checkpoint
    terminal: false
    schedule:
      _target_: tpen.checkpoint.EveryNUpdates
      every_n: 5
    payload:
      _target_: tpen.checkpoint.TrainResume
    output_dir: ${run.dir}/checkpoints

loggers:
  - _target_: tpen.logging.CSV
    path: ${run.dir}/metrics.csv
  - _target_: tpen.logging.JSONL
    path: ${run.dir}/metrics.jsonl
