[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpen"
version = "0.4.0"
description = "Specht-module equivariant neural network fermionic wavefunctions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "hydra-core",
  "numpy",
  "omegaconf",
  "PyYAML",
]

[project.scripts]
tpen = "tpen.run:main"

[project.optional-dependencies]
cpu = [
  "torch",
]
cu126 = [
  "torch",
]
cu128 = [
  "torch",
]
cu130 = [
  "torch",
]
# OLCF Frontier: AMD MI250X via ROCm wheels. Unlike the CUDA extras, torch is
# pinned here: the rocm7.1 index also carries old non-ROCm builds, and an
# unpinned `torch` silently resolves to 2.0.1 with aarch64-only wheels.
# triton-rocm is not on PyPI, so it needs its own source mapping below.
rocm71 = [
  "torch==2.13.0+rocm7.1",
  "triton-rocm; sys_platform == 'linux'",
]
test = [
  "pytest",
  "typeguard>=4",
]
wandb = [
  "wandb>=0.17",
]
submitit = [
  "hydra-submitit-launcher>=1.2",
]
parsl = [
  "parsl>=2024.10",
]
finite-difference = [
  "numdifftools==0.10.1",
]
# Hugging Face Accelerate, consumed ONLY by the DS-A0 runtime spike under
# tests/spikes/accelerate_ddp/. Deliberately an optional extra and not a runtime
# dependency or a dev group member: nothing installs it by default, so `tpen`
# itself never gains an Accelerate import path. Left unpinned to match the CUDA
# torch extras; the spike records the resolved version and `accelerate.__file__`
# in its evidence, because a version-blind receipt cannot be compared later.
# Because nothing installs it, the spike's tests skip when it is absent — so the
# spike carries a gate (A-G0) asserting the capability was actually PRESENT and
# that no arm skipped. A green run of a fully skipped suite is the failure mode
# this extra creates, and that gate is what closes it.
#
# PAIR THIS EXTRA WITH A TORCH EXTRA: `--extra cpu --extra accelerate`, never
# `--extra accelerate` alone. Accelerate depends on torch, but `accelerate` is
# absent from the `[tool.uv.sources]` torch routing below and from the
# cpu/cu126/cu128/cu130/rocm71 conflict set, so an accelerate-only resolution has
# no index to route torch to and falls back to PyPI — adding a seventh torch
# entry to the lock that drags cuda-bindings and cuda-toolkit on Linux. Paired
# with a torch extra the routed build wins and that PyPI entry stays unselected
# (verified: `uv sync --extra cpu --extra accelerate` resolves torch 2.12.0 from
# the cpu index). Adding `accelerate` to the conflict set would be wrong — it is
# complementary to those extras, not mutually exclusive with them — and routing
# it to one index would force a device choice on every consumer. This is an
# instruction, not a mechanism: nothing enforces the pairing. Tracked with the
# full analysis, the observed transitive pull, and why both obvious fixes are
# worse, as Task Orchestrator item 62b636c6-bde3-4bc0-841c-4aa34db7136e.
accelerate = [
  "accelerate",
]

[dependency-groups]
dev = [
  # experiments/baselines/adapters/deepqmc.py reads DeepQMC HDF5 traces, so the
  # HDF5-reading adapter tests in experiments/baselines/test_adapter_deepqmc.py
  # need h5py. Pinned rather than lower-bounded so the resolver cannot silently
  # take the newest: 3.11.0 is the oldest release that both installs and imports
  # here. 3.10.0 installs from its cp312 wheel but its numpy 1.x ABI is rejected
  # by this project's locked numpy 2.x, and 3.9.0 has no cp312 wheel at all so
  # it falls back to a source build that needs libhdf5.
  "h5py==3.11.0",
  "matplotlib>=3.10.9",
  "pytest",
  "typeguard>=4",
]
docs = [
  "numpydoc>=1.7",
  "sphinx>=7.2,<8",
]

[tool.uv]
python-preference = "only-managed"
default-groups = ["dev"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu130" },
    { extra = "rocm71" }
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-rocm71", extra = "rocm71" },
]
# The rocm71 index is explicit, so only packages named here are routed to it.
# triton-rocm is a torch-2.13.0+rocm7.1 dependency that does not exist on PyPI.
triton-rocm = [
  { index = "pytorch-rocm71", extra = "rocm71" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm71"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[tool.setuptools.packages.find]
include = ["tpen*"]

[tool.pytest.ini_options]
# ``experiments`` is a namespace package with no ``__init__.py``, so
# ``import experiments...`` resolves only when the repository root is on
# ``sys.path``.  ``python -m pytest`` inserts the working directory; the
# ``pytest`` console script does not.  Without this line ``uv run pytest`` --
# the invocation the project documents -- fails collection for every test under
# ``experiments/`` with ``ModuleNotFoundError: No module named 'experiments'``,
# while ``uv run python -m pytest`` collects the same files fine.  One suite
# giving two answers depending on invocation is how a green run comes to mean
# nothing.
pythonpath = ["."]
markers = [
  "integration: end-to-end tests that exercise entrypoints, configs, or generated artifacts",
]
addopts = "--typeguard-packages=tpen"
norecursedirs = [
  ".agent-scratch",
  ".agent-worktrees",
  "experiments/hooke/pair_validation",
  "experiments/hooke/pair_stability_small",
]
