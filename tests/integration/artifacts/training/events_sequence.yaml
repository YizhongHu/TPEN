# Fixture for the durable `events.jsonl` boundary-sequence test.
#
# Deliberately minimal in its callback battery: the only wired callback is one
# composed `Checkpoint` stream, solely to produce the checkpoints the resume run
# and the evaluation run restore from. `events.jsonl` is written
# by `RunContext.emit_event` itself, not by any callback, so the asserted event
# sequence stays independent of whichever callbacks a real run configures.
#
# The scale is reduced (64 walkers, 3 trainer steps); the stage stack is the
# real one -- `run_from_config` -> `Train` -> `VMCTrainer.fit` -> sampler ->
# Hamiltonian terms -> optimizer.
#
# `load.mode: none` keeps the section present but inert. The resume run
# overrides only `load`, never a hashed section, so the checkpoint's
# model/optimizer/trainer/sampler/hamiltonian config hashes still match.
experiment:
  name: events_sequence
  sector: singlet
  run_name: events_sequence_train
run:
  root: outputs
  run_id: null
  dir: null
runtime:
  seed: 0
  device: cpu
  dtype: float64
system:
  name: hooke_pair_singlet
  n_particles: 2
  spatial_dim: 3
  omega: 0.5
load:
  mode: none
runner:
  _target_: tpen.runner.Train
  model: ${model}
  sampler: ${sampler}
  hamiltonian_terms: ${hamiltonian_terms}
  optimizer: ${optimizer}
  trainer: ${trainer}
  load: ${load}
model:
  _target_: tests.helpers.trainable_wavefunctions.TrainableHookeSingletAnsatz
hamiltonian_terms:
  kinetic:
    _target_: tpen.physics.kinetic.KineticEnergy
  harmonic_trap:
    _target_: tpen.physics.potential.HarmonicTrap
    omega: ${system.omega}
  electron_electron:
    _target_: tpen.physics.potential.ElectronElectronInteraction
sampler:
  _target_: tpen.sampling.metropolis.MetropolisSampler
  n_walkers: 64
  burn_in: 5
  n_steps: 5
  proposal_scale: 0.5
  seed: ${runtime.seed}
  n_electrons: ${system.n_particles}
  spatial_dim: ${system.spatial_dim}
  dtype: ${runtime.dtype}
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.01
trainer:
  _target_: tpen.training.trainer.VMCTrainer
  max_steps: 3
  log_every_n_steps: 1
  return_terms: false
callbacks:
# One composed stream uses cadence 2 for periodic publication and always writes
# its terminal boundary. It writes one mid-run checkpoint at `next_iteration ==
# 2` and its terminal checkpoint at `next_iteration == 3`. The resume run
# restores the mid-run one so it still has an iteration left to run.
- _target_: tpen.callback.Checkpoint
  schedule:
    _target_: tpen.checkpoint.EveryNUpdates
    every_n: 2
  payload:
    _target_: tpen.checkpoint.TrainResume
  output_dir: ${run.dir}/checkpoints
